<div *ngIf="isOpen" class="modal-overlay" (click)="onClose()">
  <div class="modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="mb-0">{{ 'ISSUES.CREATE_MODAL.TITLE' | translate }}</h5>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="mb-3">
        <label class="form-label" for="issue-title">{{ 'ISSUES.CREATE_MODAL.TITLE_LABEL' | translate }}</label>
        <input
          id="issue-title"
          type="text"
          class="form-control"
          [class.is-invalid]="isControlInvalid('title')"
          formControlName="title"
          [placeholder]="'ISSUES.CREATE_MODAL.TITLE_PLACEHOLDER' | translate"
        />
        <div class="invalid-feedback d-block" *ngIf="isControlInvalid('title')">
          {{ getErrorText('title') }}
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="issue-description">{{ 'ISSUES.CREATE_MODAL.DESCRIPTION_LABEL' | translate }}</label>
        <textarea
          id="issue-description"
          rows="4"
          class="form-control"
          [class.is-invalid]="isControlInvalid('description')"
          formControlName="description"
          [placeholder]="'ISSUES.CREATE_MODAL.DESCRIPTION_PLACEHOLDER' | translate"
        ></textarea>
        <div class="invalid-feedback d-block" *ngIf="isControlInvalid('description')">
          {{ getErrorText('description') }}
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="issue-category">{{ 'ISSUES.CREATE_MODAL.CATEGORY_LABEL' | translate }}</label>
        <select
          id="issue-category"
          class="form-select"
          [class.is-invalid]="isControlInvalid('category')"
          formControlName="category"
        >
          <option value="" disabled>{{ 'ISSUES.CREATE_MODAL.CATEGORY_PLACEHOLDER' | translate }}</option>
          <option *ngFor="let cat of categoryOptions" [value]="cat">
            {{ 'ISSUES.CATEGORIES.' + cat.toUpperCase() | translate }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="isControlInvalid('category')">
          {{ getErrorText('category') }}
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="onClose()">{{ 'ISSUES.CREATE_MODAL.CANCEL' | translate }}</button>
        <button type="submit" class="btn btn-primary">{{ 'ISSUES.CREATE_MODAL.SUBMIT' | translate }}</button>
      </div>
    </form>
  </div>
</div>
