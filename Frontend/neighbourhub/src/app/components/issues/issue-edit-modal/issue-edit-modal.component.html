<div *ngIf="isOpen && report" class="modal-overlay" (click)="onClose()">
  <div class="modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="mb-0">{{ 'ISSUES.EDIT_MODAL.TITLE' | translate }}</h5>
      <button type="button" class="btn btn-sm btn-light" [attr.aria-label]="'COMMON.CLOSE' | translate" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="mb-3">
        <label class="form-label">{{ 'ISSUES.EDIT_MODAL.TITLE_LABEL' | translate }}</label>
        <input type="text" class="form-control" formControlName="title" />
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'ISSUES.EDIT_MODAL.DESCRIPTION_LABEL' | translate }}</label>
        <textarea rows="4" class="form-control" formControlName="description"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'ISSUES.EDIT_MODAL.CATEGORY_LABEL' | translate }}</label>
        <select class="form-select" formControlName="category">
          <option *ngFor="let cat of categoryOptions" [value]="cat">{{ getCategoryText(cat) }}</option>
        </select>
      </div>

      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label">{{ 'ISSUES.EDIT_MODAL.PRIORITY_LABEL' | translate }}</label>
          <select class="form-select" formControlName="priority">
            <option *ngFor="let p of priorityOptions" [value]="p">{{ getPriorityText(p) }}</option>
          </select>
        </div>
        <div class="col-6">
          <label class="form-label">{{ 'ISSUES.EDIT_MODAL.STATUS_LABEL' | translate }}</label>
          <select class="form-select" formControlName="status">
            <option *ngFor="let s of statusOptions" [value]="s">{{ getStatusText(s) }}</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'ISSUES.EDIT_MODAL.SCHEDULED_REPAIR_DATE_LABEL' | translate }}</label>
        <input
          type="date"
          class="form-control"
          [class.is-invalid]="isScheduledRepairDateInvalid()"
          [min]="minScheduledDate"
          formControlName="scheduledRepairDate"
        />
        <div class="invalid-feedback d-block" *ngIf="isScheduledRepairDateInvalid()">
          {{ 'ISSUES.EDIT_MODAL.VALIDATION.PAST_DATE' | translate }}
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="onClose()">{{ 'ISSUES.EDIT_MODAL.CANCEL' | translate }}</button>
        <button type="submit" class="btn btn-primary">{{ 'ISSUES.EDIT_MODAL.SAVE' | translate }}</button>
      </div>
    </form>
  </div>
</div>
