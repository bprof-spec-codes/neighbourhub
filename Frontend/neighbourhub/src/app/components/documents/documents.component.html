<section class="container-fluid py-4 ps-5 pe-5 documents-page">
	<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
		<div>
			<h1 class="h2 mb-1">Documents</h1>
			<p class="text-muted mb-0">Access building documents and important files</p>
		</div>

		<button type="button" class="btn btn-primary ps-3 pe-3" (click)="openAddModal()">
			Add Document
		</button>
	</div>

	<div class="row g-4">
		<div class="col-12 col-md-7 col-lg-5">
			<div class="input-group shadow-sm">
				<span class="input-group-text bg-white border-end-0">
					<i class="bi bi-search text-secondary"></i>
				</span>
				<input
					type="text"
					class="form-control border-start-0"
					[(ngModel)]="searchTerm"
					placeholder="Search documents..."
				/>
			</div>
		</div>

		<div class="col-12" *ngIf="documents$ | async as documents">
			<div class="list-group shadow-sm" *ngIf="getFilteredDocuments(documents).length > 0; else emptyState">
				<div
					*ngFor="let doc of getFilteredDocuments(documents)"
					class="list-group-item d-flex align-items-center justify-content-between gap-3 py-3"
				>
					<div class="d-flex align-items-center gap-3 min-w-0">
						<div class="doc-icon rounded-3 d-flex align-items-center justify-content-center flex-shrink-0">
							<i class="bi bi-file-earmark-text fs-5 text-primary"></i>
						</div>

						<div class="min-w-0">
							<h3 class="h6 mb-1 text-truncate">{{ doc.title }}</h3>
							<p class="text-muted small mb-0">{{ doc.uploadDate | date:'yyyy.MM.dd. HH:mm' }}</p>
						</div>
					</div>

					<div class="d-flex align-items-center gap-2 flex-shrink-0">
						<button type="button" class="btn btn-sm doc-download-btn" (click)="onDownloadDocument(doc.id)">
							<i class="bi bi-download me-1"></i>
							<span class="d-none d-sm-inline">Download</span>
						</button>
						<button
							type="button"
							class="btn p-0 close-btn"
							aria-label="Delete document"
							(click)="openDeleteModal(doc.id)"
						>
							<i class="bi bi-x"></i>
						</button>
					</div>
				</div>
			</div>

			<ng-template #emptyState>
				<div class="text-center py-5 border rounded-3 bg-light-subtle">
					<i class="bi bi-file-earmark-x fs-1 text-secondary"></i>
					<p class="text-muted mt-3 mb-0">No documents found</p>
				</div>
			</ng-template>
		</div>
	</div>
</section>

<app-add-document-modal
	[isOpen]="isAddModalOpen"
	(add)="addDocument($event)"
	(close)="closeAddModal()"
/>

<app-delete-modal
	[isOpen]="isDeleteModalOpen"
	[content]="'Are you sure you want to delete this document?'"
	(confirm)="deleteDocument()"
	(cancel)="closeDeleteModal()"
/>
