<div *ngIf="isOpen" class="document-add-modal-overlay" (click)="onClose()">
	<div class="document-add-modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
		<div class="document-add-modal-header">
			<h5 class="mb-0">Add Document</h5>
			<button type="button" class="btn btn-sm btn-light" aria-label="Close" (click)="onClose()">
				<i class="bi bi-x-lg"></i>
			</button>
		</div>

		<form [formGroup]="form" (ngSubmit)="onSubmit()" class="document-add-modal-body">
			<div class="mb-3">
				<label class="form-label" for="document-title">Title</label>
				<input
					id="document-title"
					type="text"
					class="form-control"
					[class.is-invalid]="isControlInvalid('title')"
					formControlName="title"
				/>
				<div class="invalid-feedback d-block" *ngIf="isControlInvalid('title')">
					{{ getErrorText('title') }}
				</div>
			</div>

			<div class="mb-4">
				<label class="form-label">PDF File</label>
				<div
					class="document-dropzone"
					[class.is-dragover]="isDragOver"
					(click)="openFilePicker()"
					(dragover)="onDragOver($event)"
					(dragleave)="onDragLeave()"
					(drop)="onDrop($event)"
				>
					<input
						#fileInput
						id="document-file"
						type="file"
						class="d-none"
						accept="application/pdf,.pdf"
						(change)="onFileSelected($event)"
					/>

					<div class="text-center">
						<div class="mb-2">
							<i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
						</div>
						<h6 class="mb-1">Drag and drop your PDF here</h6>
						<p class="text-muted mb-2">or click to choose a file</p>
						<div class="selected-file-name">{{ getSelectedFileName() }}</div>
					</div>
				</div>
				<div class="form-text mt-2">Only PDF files are allowed.</div>
				<div class="invalid-feedback d-block" *ngIf="isControlInvalid('file') || fileTypeError">
					{{ getErrorText('file') }}
				</div>
			</div>

			<div class="document-add-modal-footer">
				<button type="button" class="btn btn-outline-secondary" (click)="onClose()">Cancel</button>
				<button type="submit" class="btn btn-primary">Save</button>
			</div>
		</form>
	</div>
</div>
