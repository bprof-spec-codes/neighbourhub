<div *ngIf="isOpen" class="modal-overlay" (click)="onClose()">
  <div class="modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="mb-0">{{ isEditMode ? ('BOOKINGS.ROOM_MODAL.EDIT_TITLE' | translate) : ('BOOKINGS.ROOM_MODAL.ADD_TITLE' | translate) }}</h5>
      <button type="button" class="btn btn-sm btn-light" [attr.aria-label]="'COMMON.CLOSE' | translate" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">{{ 'BOOKINGS.ROOM_MODAL.NAME' | translate }}</label>
          <input type="text" class="form-control" formControlName="name" [placeholder]="'BOOKINGS.ROOM_MODAL.NAME_PLACEHOLDER' | translate" [class.is-invalid]="isInvalid('name')">
          <div class="invalid-feedback">{{ 'BOOKINGS.ROOM_MODAL.VALIDATION.NAME_REQUIRED' | translate }}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">{{ 'BOOKINGS.ROOM_MODAL.DESCRIPTION' | translate }}</label>
          <textarea class="form-control" formControlName="description" rows="3" [placeholder]="'BOOKINGS.ROOM_MODAL.DESCRIPTION_PLACEHOLDER' | translate"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">{{ 'BOOKINGS.ROOM_MODAL.CAPACITY' | translate }}</label>
          <input type="number" class="form-control" formControlName="capacity" min="1" [class.is-invalid]="isInvalid('capacity')">
          <div class="invalid-feedback">{{ 'BOOKINGS.ROOM_MODAL.VALIDATION.CAPACITY_MIN' | translate }}</div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="onClose()">{{ 'BOOKINGS.ROOM_MODAL.CANCEL' | translate }}</button>
        <button type="submit" class="btn btn-primary flex-grow-1">{{ isEditMode ? ('BOOKINGS.ROOM_MODAL.SAVE' | translate) : ('BOOKINGS.ROOM_MODAL.ADD' | translate) }}</button>
      </div>
    </form>
  </div>
</div>
