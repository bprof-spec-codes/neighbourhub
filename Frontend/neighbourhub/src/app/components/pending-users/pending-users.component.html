<div class="approval-container">
  <div class="header-section">
    <h2><i class="bi bi-person-check"></i> Pending Registrations</h2>
    <p>Here you can approve the access of new residents to the system.</p>
  </div>

  <div class="table-card">
    <table class="approval-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Apartment Number</th>
          <th>Roles</th>
          <th class="text-center">Operations</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profile of profileService.profilessShort$ | async">
          <td class="align-middle">{{ profile.fullName }}</td>
          <td class="align-middle">{{ profile.email }}</td>
          <td class="align-middle text-center">
            <span class="badge-apartment">{{ profile.apartmentNumber }}</span>
          </td>
          <td class="align-middle">
            <div class="role-tags">
              <select [(ngModel)]="profile.role" class="form-select form-select-sm role-select">
                <option value="Occupant">Occupant</option>
                <option value="Owner">Owner</option>
                <option value="Tenant">Tenant</option>
              </select>
            </div>
          </td>
          <td class="actions align-middle">
            <div class="d-flex justify-content-center align-items-center gap-2">
              <button class="btn btn-outline-success" (click)="onApprove(profile.id, profile.role)" title="Approval">
                <i class="bi bi-check-lg"></i>
              </button>
              <button class="btn btn-outline-danger" (click)="onReject(profile.id)" title="Rejection">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
