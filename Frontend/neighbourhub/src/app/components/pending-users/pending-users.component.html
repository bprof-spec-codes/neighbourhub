<div class="approval-container">
  <div class="header-section">
    <h2><i class="bi bi-person-check"></i> Pending Registrations</h2>
    <p>Here you can approve the access of new residents to the system.</p>
  </div>

  <div class="table-card">
    <table class="approval-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Apartment Number</th>
          <th>Roles</th>
          <th class="text-center">Operations</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profile of profileService.profilessShort$ | async">
          <td>{{ profile.fullName }}</td>
          <td>{{ profile.email }}</td>
          <td><span class="badge-apartment">{{ profile.apartmentNumber }}</span></td>
          <td>
            <div class="role-tags">
              <span class="role-tag">{{ profile.role }}</span>
            </div>
          </td>
          <td class="actions">
            <button class="btn btn-outline-success" (click)="onApprove(profile.id, profile.role)" title="Approval">
              <i class="bi bi-check-lg"></i>
            </button>
            <button class="btn btn-outline-danger" (click)="onReject(profile.id)" title="Rejection">
              <i class="bi bi-x-lg"></i>
            </button>
          </td>
        </tr>
        
        <tr *ngIf="(profileService.profilessShort$ | async)?.length === 0">
          <td colspan="5" class="empty-state">
            There are no profiles awaiting approval.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
